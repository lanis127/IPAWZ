<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO DE VOLUNTÁRIOS</title>

    <style>
        body {
            background-color: #f5f376;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: #ff5adb;
            font-size: 48px;
        }

        p {
            color: #ffffff;
            font-size: 20px;
        }

        .container-flex {
            display: flex;
            gap: 40px;
        }

        .coluna {
            flex: 1;
        }

        a {
            color: rgb(255, 73, 225);
        }

    </style>
</head>

<body>
    <h1>CADASTRO DE VOLUNTÁRIOS</h1>
    <div class="container-flex">
        <div class="coluna">
            <h3>INICIO</h3>
        </div>
        <div class="coluna">
            <h3>MENU</h3>
        </div>
    </div>
    <a href="">CADASTRO</a>
    <br>
    <br>
    <br>
    <br>
    <form action="">
        <div>
            <label for="name">Nome: </label>
            <input type="text" id="nome" name="">
        </div>
        <div>
            <label for="email">E-mail: </label>
            <input type="email" id="email" name="">
        </div>
        <div>
            <label for="number">Telefone: </label>
            <input type="number" id="numero" name="">
        </div>
        <div>
            <label for="password">Senha: </label>
            <input type="password" id="senha" name="">
        </div>
        <br>
        <br>
        <button> Cadastrar</button>
    </form>
</body>
</html>
