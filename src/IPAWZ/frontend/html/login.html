<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="../css/signInOut.css">
</head>
<body>

    <main class="auth-container">

        <section class="left-panel">
            <a href="index.html" class="back-btn">&#10094;</a>

            <h2>
                Seja bem-vindo(a) de volta.<br>
                Entre e continue fazendo a diferença!
            </h2>

            <img src="../assets/icons/cão-e-gato-login.svg" alt="Animais">
        </section>

        <section class="right-panel">

            <div class="form-card">

                <h1>Login</h1>

                <form>
                    <input type="email" placeholder="E-mail" required>

                    <div class="password-field">
                        <input type="password" placeholder="Senha" required>
                    </div>

                    <a href="#" class="link-small">
                        Esqueceu a senha?
                    </a>

                    <button type="submit" class="btn-primary">
                        Login
                    </button>
                </form>

                <p class="account-text">
                    Não tem uma conta?
                    <a href="selecaoPfPj.html">Cadastre-se</a>
                </p>

                <div class="separator">
                    <span>ou entre com</span>
                </div>

                <button class="google-btn">
                    <img src="../assets/icons/google-icon.svg" alt="Google">
                </button>

            </div>

        </section>

    </main>

</body>
</html>
