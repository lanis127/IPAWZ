<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | IPAWZ</title>
    <link rel="stylesheet" href="../css/signInOut.css">
</head>
<body>

    <main class="auth-container">

        <section class="left-panel">
            <a href="inicio.html" class="back-btn" aria-label="Voltar">&#10094;</a>
            <h2>Crie sua conta e faça a diferença na vida de um animal!</h2>
            <img src="../assets/icons/pessoas-animais-cadastro.svg" alt="Pessoas com animais">
        </section>

        <section class="right-panel">
            <div class="form-card">

                <h1>Cadastro</h1>

                <p class="subtitle">
                    Antes de realizar seu cadastro, responda<br>
                    em qual desses você se encaixa:
                </p>

                <div class="opcao-container" id="selecao-perfil">
                    <label class="opcao">
                        <input type="radio" name="tipo_pessoa" value="pf">
                        <span>Pessoa Física</span>
                    </label>
                    <label class="opcao">
                        <input type="radio" name="tipo_pessoa" value="pj">
                        <span>Pessoa Jurídica</span>
                    </label>
                </div>

                <p class="account-text">
                    Já tenho uma conta? Faça <a href="login.html">Login</a>
                </p>
            </div>
        </section>

    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
