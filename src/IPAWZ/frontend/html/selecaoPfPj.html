<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Perfil</title>

    <link rel="stylesheet" href="../css/signInOut.css">
</head>
<body>

<main class="auth-container">

    <section class="left-panel">

        <a href="login.html" class="back-btn">
            &#10094;
        </a>

        <h2>
            Crie sua conta e faça a diferença
            na vida de um animal!
        </h2>

        <img src="../assets/icons/pessoas-animais-cadastro.svg" alt="">
    </section>

    <section class="right-panel">

        <div class="form-card">

            <h1>Cadastro</h1>

            <p class="subtitle">
                Antes de realizar seu cadastro, responda <br>
                em qual desses você se encaixa:
            </p>


            <div class="opcao-container">
                <label class="opcao">
                  <input type="radio" name="tipo_pessoa" value="pf" />
                  <span>Pessoa Física</span>
                </label>
              
                <label class="opcao">
                  <input type="radio" name="tipo_pessoa" value="pj" />
                  <span>Pessoa Jurídica</span>
                </label>
              </div>

        </div>

    </section>

</main>

<script src="../js/selecao.js"></script>

</body>
</html>
