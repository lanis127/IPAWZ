<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPAWZ</title>
    <link rel="stylesheet" href="../css/inicio.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/listagem-pets.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>

<body data-pagina="doacao">

    <div id="ipz-header"></div>

    <!-- Conteúdo da página -->
    <main class="content">

         <!-- ================= COMO DOAR =============== -->

        <section class="como-doar">

            <div class="container-home">

                <div class="conteudo-doacao">
                    
                    <div class="imagem-doacao">

                        <img src="../assets/img/caridade2.png" alt="Ilustração de doação">

                    </div>

                    <div class="texto-doacao">

                        <h2>Faça uma doação e transforme vidas!</h2>

                        <div class="passos-doacao">

                            <h3>Como doar:</h3>

                            <ul>

                                <li>
                                    - Escolha a instituição que você queira ajudar
                                </li>

                                <li>
                                    - Selecione o tipo de doação que deseja realizar
                                </li>

                                <li>
                                    - Confirme a doação e mude vidas
                                </li>

                            </ul>
                            <a href="tipos-doacao.html" class="btn-doar">Quero doar</a>

                        </div>

                    </div>

                </div>

            </div>

        </section>

        <!-- ================== ONGS PARCEIRAS ======================= -->

        <section class="ongs-parceiras" id="instituicoes">

            <div class="container-home">

                <h2>Instituições e ONGs parceiras</h2>

                <div class="carrossel-wrapper">

                    <button class="seta-carrossel seta-esquerda" aria-label="Anterior">

                        &#10094;

                    </button>

                    <div class="janela-carrossel">

                        <div class="trilha-carrossel">
                            <p class="ipz-estado">Carregando instituições...</p>
                        </div>

                    </div>

                    <button class="seta-carrossel seta-direita" aria-label="Próximo">

                        &#10095;

                    </button>

                </div>

                <!-- Indicadores criados pelo JavaScript -->
                <div class="indicadores-carrossel"></div>

            </div>

        </section>

    </main>

    <div id="ipz-footer"></div>
    
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/home.js"></script>
    <script src="../js/carrossel-ongs.js"></script>
</body>

</html>
