<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da vaga | IPAWZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/detalhes-vaga-voluntariado.css">
    <link rel="stylesheet" href="../css/listagem-pets.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body data-pagina="voluntarios">

    <div id="ipz-header"></div>

    <main class="content vacancy-page">
        <!-- Título principal da oportunidade -->
        <section class="vacancy-heading">
            <h1 id="titulo-vaga">Carregando vaga...</h1>
        </section>

        <!-- Imagem do local da oportunidade -->
        <section class="vacancy-image-area" aria-label="Local da oportunidade">
            <img id="imagem-vaga" src="../assets/img/vaga-voluntariado.jpg"
            alt="Espaço de convivência dos animais da instituição">
        </section>

        <!-- Informações resumidas da vaga -->
        <section class="vacancy-info" aria-label="Informações da vaga">
            <article class="info-item">
                <h2>Tipo de voluntariado</h2>
                <p id="tipo-vaga"></p>
            </article>

            <article class="info-item">
                <h2>Localização</h2>
                <p id="localizacao-vaga"></p>
            </article>

            <article class="info-item">
                <h2>Data</h2>
                <p id="data-vaga"></p>
            </article>

            <article class="info-item">
                <h2>Instituição / ONG</h2>
                <p id="instituicao-vaga"></p>
            </article>
        </section>

        <!-- Descrição completa da oportunidade -->
        <section class="vacancy-description">
            <h2>Descrição da vaga</h2>
            <div id="descricao-vaga" class="description-text"></div>
        </section>

        <section class="vacancy-action">
            <label class="mensagem-candidato" for="mensagem-voluntario" hidden id="rotulo-mensagem">
                Conte por que você quer participar (opcional):
                <textarea id="mensagem-voluntario" rows="3" maxlength="600"></textarea>
            </label>
            <button type="button" id="btn-candidatar" class="btn-candidatar">
                Candidate-se
            </button>
            <p id="mensagem-candidatura" class="application-message" role="status" aria-live="polite" hidden></p>
        </section>
    </main>

    <div id="ipz-footer"></div>
    
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/detalhes-vaga-voluntariado.js"></script>
</body>
</html>
