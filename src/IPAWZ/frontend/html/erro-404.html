<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPAWZ</title>
    <link rel="stylesheet" href="../css/erro-404.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>

<body>

    <div id="ipz-header"></div>

<!-- ================= CONTEÚDO PRINCIPAL: ERRO 404 ================= -->

<main class="content pagina-erro">

    <!-- Título principal da página de erro -->
    <h1 class="titulo-erro">
        Ops! Parece que este pet levou você para
        <br class="quebra-desktop">
        um caminho diferente.
    </h1>

    <!-- Imagem central do cachorrinho com a placa 404 -->
    <div class="imagem-erro-container">

        <img
            src="../assets/img/cao404.png"
            alt="Cachorrinho segurando uma placa com o número 404"
            class="imagem-erro"
        >

    </div>

    <!-- Mensagem explicativa -->
    <p class="descricao-erro">
        A página que você procura não existe ou foi movida. Volte para a
        <br class="quebra-desktop">
        <a href="inicio.html">página inicial</a> e continue fazendo a diferença na vida de muitos
        <br class="quebra-desktop">
        animais.
    </p>

</main>

    <div id="ipz-footer"></div>
    
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
</body>

</html>
